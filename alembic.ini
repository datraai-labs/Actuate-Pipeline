[alembic]
script_location = src/actuate/catalog/migrations
prepend_sys_path = src
# sqlalchemy.url is NOT set here on purpose. It comes from Settings at runtime
# (ACTUATE_DATABASE_URL, or AWS Secrets Manager via ACTUATE_DB_SECRET_ARN).
# A URL in a checked-in file is how credentials end up in git.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
