[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actuate-delivery"
version = "0.1.0"
description = "Actuate multimodal capture verification and dataset delivery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=2.5,<3",
    "pyarrow>=25,<26",
    "typer>=0.12,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
actuate = "actuate_delivery.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/actuate_delivery" = ["review/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
