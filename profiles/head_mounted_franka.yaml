# The integration-gate profile: head-mounted human capture -> Franka Panda.
rig: head_mounted
embodiment: franka_panda
# aligned_robot deliberately unset: franka_panda has no calibrated camera_intrinsics,
# so an aligned claim would flag UNVERIFIABLE (see Part E). Volume tier is the truth.
# RAW-bytes hash (content_address of the source capture) -- the ingest hash of a
# processed session sees only the compressed payload, so the identity is pinned here.
capture_id: 579231cbb0b212eccc6049f9c8fa6ecdef93424c539edfc76dc60f9156bf2ccd
task: "Sort and staple paperwork at the workbench."
video: redacted_compressed.mp4

perception:
  enabled: true
  max_frames: 45            # 4 GB VRAM laptop; GPU stages cache under .actuate_cache/
  prompts: [stapler, paper]

retarget:
  arm_model: models/arm_estimator.pt   # absent -> stage SKIPS with the reason (train on Kaggle)

language:
  mode: reuse                          # $0: attach the already-paid Part A annotations
  reuse_from: out/session_001_certified.json

export:
  formats: [lerobot, rlds]
  tier: all

viz: true
