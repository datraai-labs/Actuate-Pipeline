[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actuate"
version = "2.0.0-dev"
description = "Multimodal capture -> certified, retargeted, VLA-training-ready robot data."
requires-python = ">=3.10"

# Core stays CPU-only and light. Per Master Spec §5 ("GPU boundary"), the schema,
# fusion, canonical, certification and the exporters must install and run WITHOUT a
# GPU stack, so value ships before any model does. Heavy deps live in extras.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Storage + catalog backbone (AWS Architecture doc). Not required for local dev/tests:
# the LocalBackend has no AWS dependency at all, which is what lets the storage
# abstraction be proven before any bucket exists.
aws = [
    "boto3>=1.34",
    "s3fs>=2024.6",
    "fsspec>=2024.6",
    "pyarrow>=16.0",
    "zarr>=2.18",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
]
perception = ["torch>=2.2", "transformers>=4.40", "opencv-python>=4.8", "mediapipe==0.10.14"]
# Arm retargeting (L5). MuJoCo for kinematics/IK/replay + robot_descriptions for URDFs/MJCF.
# NOTE: not Pinocchio -- `pin` has no Windows wheels and fails to build; MuJoCo covers FK,
# Jacobian IK, and physics replay in one dep that installs on Windows AND Linux/Kaggle.
retarget = ["torch>=2.2", "mujoco>=3.1", "robot_descriptions>=1.9", "scipy>=1.11"]
# Full-body BVH/SMPL-X -> humanoid retargeting from Araujo et al. (arXiv:2510.02252).
# Pin the reference implementation so its robot assets and IK mappings are reproducible.
humanoid-retarget = [
    "general-motion-retargeting @ git+https://github.com/YanjieZe/GMR.git@bb1bbe40774794fceb2a7c579a3464a28e68c844",
    "daqp>=0.7",
    "certifi>=2024.7",
]
sim = ["mujoco>=3.1"]
# Rerun visualization (`actuate viz`). Viewer-free import; only needed to log/open recordings.
viz = ["rerun-sdk>=0.20", "opencv-python>=4.8", "av>=12"]
# SDK source resolvers (Phase 6): pull data from HuggingFace / URLs / Open-X. s3fs+fsspec
# are already in [aws]; huggingface_hub + datasets add the HF read/write path.
sources = ["huggingface_hub>=0.23", "datasets>=2.19", "requests>=2.31", "fsspec>=2024.6"]
# lerobot + tfds are the export gate targets (load+train / tfds.load).
export = ["lerobot>=0.1", "tensorflow-datasets>=4.9"]
# RLDS needs a separate environment from perception: TensorFlow Metadata requires protobuf
# >=6.31 while MediaPipe/UniDepth's dependency chain is pinned below 6 in [all].
rlds = [
    "tensorflow>=2.20,<2.22",
    "tensorflow-datasets>=4.9",
    "tensorflow-metadata>=1.17",
    "protobuf>=6.31,<7",
    "opencv-python-headless>=4.8",
    "importlib-resources>=6.4",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "import-linter>=2.0",
    "testcontainers[postgres]>=4.5",
]
# Everything a robotics-lab engineer needs for `pip install actuate[all]` -> process
# real data end-to-end (perception + retarget + viz + sources + export + aws).
all = [
    "torch>=2.2", "transformers>=4.40", "opencv-python>=4.8", "mediapipe==0.10.14",
    "mujoco>=3.1", "robot_descriptions>=1.9", "scipy>=1.11",
    "general-motion-retargeting @ git+https://github.com/YanjieZe/GMR.git@bb1bbe40774794fceb2a7c579a3464a28e68c844",
    "daqp>=0.7", "certifi>=2024.7",
    "rerun-sdk>=0.20", "av>=12",
    "huggingface_hub>=0.23", "datasets>=2.19", "requests>=2.31",
    "boto3>=1.34", "s3fs>=2024.6", "fsspec>=2024.6", "pyarrow>=16.0",
    "lerobot>=0.1", "tensorflow-datasets>=4.9",
    "anthropic>=0.40", "pyyaml>=6.0",
    # protobuf is a genuine three-way conflict: tensorflow/tfds want >=6.31, but wandb
    # (imported by UniDepth, the DEPTH stage) and mediapipe break on protobuf 7.x. PERCEPTION
    # is the core path and must import, so we pin protobuf <6 -- LeRobot v3 export works here
    # too. The one casualty is the RLDS (tfds) SECONDARY exporter, which needs >=6.31 and
    # degrades with a clear message; run RLDS export in a separate env if you need it.
    "protobuf>=5.28,<6",
]

[project.scripts]
actuate = "actuate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/actuate"]

[tool.hatch.metadata]
allow-direct-references = true

# src/actuate is the library-shaped, pip-installable core (Master Spec §2.1). The
# numbered v1 stage scripts in scripts/ remain the execution path and keep their
# numeric prefixes on purpose — DAG order being visible from the filesystem is worth
# more than importability for those files. They migrate into the package layer by layer.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
markers = [
    "real_data: exercises a real captured session on disk, not a synthetic fixture",
    "needs_docker: requires Docker (testcontainers Postgres)",
    "needs_aws: requires real AWS credentials for a DatraAI-owned account",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
# Numbered script filenames (01_ingest.py, etc.) aren't valid Python module names —
# that's intentional (see note above), not a lint violation to fix.
exclude = ["scripts", "infra/cdk.out"]
