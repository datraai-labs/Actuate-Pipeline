[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trinet-delivery"
version = "0.1.0"
description = "Panoculon Trinet delivery hygiene pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5,<3",
    "pyarrow>=25,<26",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
trinet-delivery = "trinet_delivery.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
